name: CI

on:
  push:
    branches: [master, '[0-9]+.x']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `app/sitemap.ts` derives each page's lastmod from its last commit
          # date, which needs real history rather than a depth-1 clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Formatting, linting, typecheck, internal links, contract drift, blog/FAQ
      # frontmatter, script self-tests, the production build (which
      # static-exports to out/ and generates the Pagefind index via postbuild),
      # then HTML nesting validation of that exported output.
      #
      # NEXT_PUBLIC_SITE_URL is intentionally unset here: this job validates
      # that the site builds, it does not publish. The deploy job below supplies
      # the real origin.
      - run: npm run check

      # A build that produces no search index would ship a search box that
      # silently returns nothing, so fail loudly instead.
      - name: Verify search index was generated
        run: |
          test -f out/_pagefind/pagefind.js \
            || { echo "::error::Pagefind index missing — search would be broken"; exit 1; }
          echo "search index OK"

  deploy:
    # Only the default branch publishes. PRs and other branches stop at check.
    if: github.ref == 'refs/heads/1.x' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Two pushes landing together would otherwise race to publish; let the
    # newer one win rather than interleaving deployments.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # NEXT_PUBLIC_SITE_URL is read at build time — it is inlined into the
      # output, and canonical tags plus sitemap.xml are generated here. Setting
      # it only at runtime would have no effect.
      #
      # SITE_URL is an optional repository variable, for when a custom domain is
      # attached. Unset, this falls back to the Pages origin.
      #
      # This is a GitHub Pages *project* site, served from
      # https://<user>.github.io/vendra-web — not the root of its own domain —
      # so BASE_PATH carries the /<repo> prefix. Next uses it to rewrite
      # `next/link` hrefs and its own asset URLs; an empty value here would
      # point every link and every `_next/` asset at the domain root and ship a
      # broken, unstyled site. Switching to a custom domain means clearing this
      # back to '' and setting SITE_URL + SITE_DOMAIN.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          BASE_PATH: '/vendra-web'
        run: npm run build

      # GitHub Pages needs CNAME inside the artifact to keep serving the custom
      # domain; it is not preserved across deployments otherwise.
      - name: Add CNAME
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
